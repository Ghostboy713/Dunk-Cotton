<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dunk Cotton</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="./assets/logocutout2.png" type="image/x-icon">
</head>
<body class="contact-page">
    <div class="navbar">
        <a href="index.html"><img src="./assets/logocutout2.png" id="logo"></a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Gallery-wedding.html">Services</a></li>
            <li><a href="ContactUs.html">Contact</a></li>
        </ul>
    </div>

    <section class="contact-section">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Get in touch with us for any inquiries or support.</p>
            <div class="contact-content">
                <div class="contact-info">
                    <h2>Our Information</h2>
                    <p>Email: info@dunkcotton.com</p>
                    <p>Phone: +1 (123) 456-7890</p>
                    <p>Address: 123 Fashion Street, Style City, SC 12345</p>
                </div>
                <div class="contact-form">
                    <h2>Send us a message</h2>
                    <form action="#" method="post">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                        
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                        
                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
